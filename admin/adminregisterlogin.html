  <body>

    <div class="main">
      <div class="container a-container" id="a-container">
        <form class="form" id="a-form" method="POST" action="adminregister.php">
          <h2 class="form_title title">Create Account</h2>
          <input class="form__input" type="text" placeholder="Name" id="username" name="username" required>
          <input class="form__input" type="text" placeholder="Email" id="email" name="email" required>
          <input class="form__input" type="password" placeholder="Password" id="password" name="password" required>
          <input class="form__input" type="password" placeholder="Confirm Password" id="confirm_password" name="confirm_password" required>
          <button type="submit" style="width: 180px; height: 50px; border-radius: 25px; margin-top: 20px; font-weight: 700; font-size: 14px; letter-spacing: 1.15px; background-color: #4B70E2; color: #f9f9f9; box-shadow: 8px 8px 16px #d1d9e6, -8px -8px 16px #f9f9f9; border: none; outline: none; cursor: pointer; transition: background-color 0.3s ease, box-shadow 0.3s ease;">SIGN UP</button>
        </form>
      </div>
      <div class="container b-container" id="b-container">
        <form class="form" id="b-form" method="POST" action="adminlogin.php">
          <h2 class="form_title title">Login in to Admin Panel</h2>
          <input class="form__input" type="text" placeholder="Name" id="username" name="username" required>
          <input class="form__input" type="password" placeholder="Password" id="password" name="password" required>
          <button type="submit" style="width: 180px; height: 50px; border-radius: 25px; margin-top: 20px; font-weight: 700; font-size: 14px; letter-spacing: 1.15px; background-color: #4B70E2; color: #f9f9f9; box-shadow: 8px 8px 16px #d1d9e6, -8px -8px 16px #f9f9f9; border: none; outline: none; cursor: pointer; transition: background-color 0.3s ease, box-shadow 0.3s ease;">LOGIN</button>

        </form>
      </div>
      <div class="switch" id="switch-cnt">
        <div class="switch__circle"></div>
        <div class="switch__circle switch__circle--t"></div>
        <div class="switch__container" id="switch-c1">
          <h2 class="switch__title title">Welcome Back !</h2>
          <p class="switch__description description">To proceed to the admin panel please login with your personal info</p>
          <button class="switch__button button switch-btn" style="background-color: #4B70E2;">LOGIN</button>
        </div>
        <div class="switch__container is-hidden" id="switch-c2">
          <h2 class="switch__title title">Hello Admin !</h2>
          <p class="switch__description description">Enter your personal details and start using the admin panel</p>
          <button class="switch__button button switch-btn">SIGN UP</button>
        </div>
      </div>
    </div>

    <script>
      
      function getQueryParam(name) {
          const urlParams = new URLSearchParams(window.location.search);
          return urlParams.get(name);
      }
  

      const error = getQueryParam('error');
  
      
      console.log('Error:', error);
  
      
      if (error) {
          const errorMessageElement = document.createElement('p');
          errorMessageElement.textContent = 'Error: ' + error;
          document.body.appendChild(errorMessageElement);
      }
  </script>

<script>
  
  function getQueryParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
  }


  const error = getQueryParam('error');

  if (error) {
      let errorMessage;
      switch (error) {
          case 'incorrectusername':
              errorMessage = 'Error: Incorrect username';
              break;
          case 'incorrectpassword':
              errorMessage = 'Error: Incorrect password';
              break;
          case 'invalidcredentials':
              errorMessage = 'Error: Invalid credentials';
              break;
          default:
              errorMessage = 'Error: Unknown error';
              break;
      }

      const errorMessageElement = document.createElement('p');
      errorMessageElement.textContent = errorMessage;
      document.body.appendChild(errorMessageElement);
  }
</script>
